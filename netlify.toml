[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/football"
  to = "/.netlify/functions/football-api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API-Football FREE = 10 requêtes/minute.
# Le mapping actuel représente 14 IDs API : deux shards de 7 évitent le 429.
[functions."calendar-sync"]
  schedule = "0 */6 * * *"

[functions."calendar-sync-b"]
  schedule = "2 */6 * * *"
