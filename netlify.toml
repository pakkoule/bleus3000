[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["data/U23_FEMININES_2014_2026_V1.json"]

[[redirects]]
  from = "/api/sportsdb-live"
  to = "/.netlify/functions/sportsdb-live"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Un seul synchroniseur : prochains + derniers matchs de toutes les sélections mappées.
[functions."calendar-sync"]
  schedule = "0 */6 * * *"
